name: g4-kafka

services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:latest}
    # Le nom du conteneur est l'adresse que les autres services joignent : il doit
    # rester identique à KAFKA_BROKERS dans les fichiers d'environnement.
    container_name: g4_kafka
    restart: unless-stopped
    environment:
      # Mode KRaft : un seul nœud tient à la fois le rôle de broker et de contrôleur.
      # Pas de Zookeeper, une dépendance de moins à déployer et à surveiller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@g4_kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      # Le piège classique. Le broker renvoie cette adresse aux clients après leur
      # première connexion, et c'est celle qu'ils utilisent ensuite. Y mettre
      # localhost ferait fonctionner le broker depuis l'hôte mais échouer tous les
      # conteneurs du réseau, avec une erreur qui ne pointe pas vers cette ligne.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://g4_kafka:9092

      # Un seul nœud : rien ne peut être répliqué ailleurs.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Création implicite refusée : un topic naîtrait alors avec les réglages par
      # défaut, donc sans compaction pour le référentiel des sites. Mieux vaut une
      # erreur lisible qu'un topic silencieusement mal configuré.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Chemin explicite plutôt que le défaut de l'image, pour que le volume porte
      # réellement les données.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - g4_kafka_data:/var/lib/kafka/data
    networks:
      - g4_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Service à usage unique : crée les topics puis s'arrête. La compaction du
  # référentiel est une propriété fixée à la création du topic, impossible à
  # rattraper depuis le producteur.
  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:latest}
    container_name: g4_kafka_init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - g4_net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        creer() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server g4_kafka:9092 \
            --create --if-not-exists --topic "$$1" --partitions 1 --replication-factor 1 $$2
        }
        creer "${KAFKA_TOPIC_MEASURE_RAW:-enervision.measure_raw}"
        creer "${KAFKA_TOPIC_MEASURE_IMPUTED:-enervision.measure_imputed}"
        creer "${KAFKA_TOPIC_ALERT:-enervision.alert}"
        creer "${KAFKA_TOPIC_SITE:-enervision.site}" "--config cleanup.policy=compact"
        echo "topics en place :"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server g4_kafka:9092 --list

volumes:
  g4_kafka_data:
    name: g4_kafka_data_${STAGE}

networks:
  g4_net:
    external: true
