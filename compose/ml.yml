name: g4-ml

services:
  ml:
    image: ${IMAGE}
    container_name: g4_ml
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    # Environnement Azure : ce service consomme une base locale restaurée
    # depuis l'archive chiffrée (voir scripts/restore.sh), pas la base
    # on-premise directement.
    networks:
      - g4_net

networks:
  g4_net:
    external: true
