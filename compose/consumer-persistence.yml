name: g4-consumer-persistence

services:
  consumer-persistence:
    # Même image que le collecteur : les deux points d'entrée y sont installés, seule
    # la commande distingue les trois rôles.
    image: ${IMAGE}
    container_name: g4_consumer_persistence
    entrypoint: ["enervision-consumer"]
    command: ["consume-persistence"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}

      # KAFKA_BROKERS est le nom partagé par tous les services, le consumer attend
      # KAFKA_BOOTSTRAP_SERVERS : la traduction se fait ici, comme pour le collecteur.
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKERS}

      # Les deux consumers lisent le référentiel : site_id est une clé étrangère des
      # deux côtés, et rien ne garantit que l'autre service ait rattrapé le sien.
      KAFKA_TOPIC_SITE: ${KAFKA_TOPIC_SITE:-enervision.site}
      KAFKA_TOPIC_MEASURE_RAW: ${KAFKA_TOPIC_MEASURE_RAW:-enervision.measure_raw}
      KAFKA_TOPIC_MEASURE_IMPUTED: ${KAFKA_TOPIC_MEASURE_IMPUTED:-enervision.measure_imputed}

      # KAFKA_CONSUMER_GROUP n'est volontairement pas renseigné : chaque service a son
      # propre défaut. Le fixer ici mettrait les deux dans le même groupe, où ils se
      # partageraient le topic des sites au lieu de le recevoir chacun en entier.

      LOG_LEVEL: ${CONSUMER_LOG_LEVEL:-INFO}
      LOG_AS_JSON: ${CONSUMER_LOG_AS_JSON:-true}
    networks:
      - g4_net
    # Le consumer termine le message en cours et acquitte son offset avant de rendre
    # la main. Sans ce délai, docker enverrait SIGKILL au bout de 10 s et le message
    # serait retraité au redémarrage.
    stop_grace_period: 30s
    # Pas de depends_on : chaque fichier compose est un projet distinct. Le consumer
    # supporte de démarrer avant le broker ou avant que les topics existent, il
    # journalise l'indisponibilité et réessaie.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  g4_net:
    external: true
