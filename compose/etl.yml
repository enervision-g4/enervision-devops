name: g4-etl

services:
  etl:
    image: ${IMAGE}
    container_name: g4_etl
    restart: unless-stopped
    environment:
      # Source des mesures. Le collecteur ne touche jamais a la base de donnees :
      # il publie dans Kafka, que les consumers relaient vers PostgreSQL.
      API_MOCK_BASE_URL: ${API_MOCK_BASE_URL}
      API_MOCK_TIMEOUT_SECONDS: ${API_MOCK_TIMEOUT_SECONDS:-5}
      API_MOCK_SOURCE_TIMEZONE: ${API_MOCK_SOURCE_TIMEZONE:-UTC}

      # Vide ou ALL : tout le parc expose par l'API. Une liste restreint la collecte.
      SITES: ${ETL_SITES:-ALL}
      POLL_INTERVAL_SECONDS: ${ETL_POLL_INTERVAL_SECONDS:-60}
      SITE_REFRESH_INTERVAL_SECONDS: ${ETL_SITE_REFRESH_INTERVAL_SECONDS:-3600}
      IMPUTATION_MAX_GAP_MEASURES: ${ETL_IMPUTATION_MAX_GAP_MEASURES:-3}

      # KAFKA_BROKERS est le nom partage par tous les services, le collecteur
      # attend KAFKA_BOOTSTRAP_SERVERS : la traduction se fait ici.
      PUBLISHER_TARGET: ${ETL_PUBLISHER_TARGET:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC_SITE: ${KAFKA_TOPIC_SITE:-enervision.site}
      KAFKA_TOPIC_MEASURE_RAW: ${KAFKA_TOPIC_MEASURE_RAW:-enervision.measure_raw}
      KAFKA_TOPIC_MEASURE_IMPUTED: ${KAFKA_TOPIC_MEASURE_IMPUTED:-enervision.measure_imputed}
      KAFKA_TOPIC_ALERT: ${KAFKA_TOPIC_ALERT:-enervision.alert}

      LOG_LEVEL: ${ETL_LOG_LEVEL:-INFO}
      LOG_AS_JSON: ${ETL_LOG_AS_JSON:-true}
    networks:
      - g4_net
    # Le collecteur termine son cycle avant de s'arreter : sans ce delai, docker
    # enverrait SIGKILL au bout de 10 s et la file de publication serait perdue.
    stop_grace_period: 30s
    # Pas de "ports:" : ce service n'expose rien. Le port de metriques viendra
    # avec Prometheus, accompagne d'un healthcheck.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  g4_net:
    external: true
