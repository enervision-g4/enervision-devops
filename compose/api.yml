name: g4-api

services:
  api:
    image: ${IMAGE}
    container_name: g4_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - g4_net
    # Pas de "ports:" par défaut. À ajouter uniquement si ce service doit
    # être exposé directement (sinon, passer par le dashboard ou un reverse
    # proxy géré séparément).

networks:
  g4_net:
    external: true
