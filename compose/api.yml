name: g4-api

services:
  api:
    image: ${IMAGE}
    container_name: g4_api_${STAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      API_USERNAME: ${API_USERNAME}
      API_PASSWORD_HASH: ${API_PASSWORD_HASH}
    networks:
      - g4_net
    # Pas de "ports:" par défaut. À ajouter uniquement si ce service doit
    # être exposé directement (sinon, passer par le dashboard ou un reverse
    # proxy géré séparément).

networks:
  g4_net:
    external: true
