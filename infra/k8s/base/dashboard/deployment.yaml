---
# Dashboard Vue.js servi par nginx.
#
# Aucun port n'est publié sur l'hôte : l'exposition passe par l'Ingress
# Traefik (base/ingress/), dont le nom d'hôte est fixé par la surcouche.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: g4-dashboard
  labels:
    app.kubernetes.io/name: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/enervision-g4/enervision-dashboard:placeholder
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - secretRef:
                name: g4-env
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
