---
# Deux Services : "g4-kafka" est le nom que les clients utilisent
# (KAFKA_BROKERS=g4-kafka:9092) ; "g4-kafka-headless" donne au pod son
# identité stable, nécessaire pour que l'advertised.listener pointe sur
# lui-même.
apiVersion: v1
kind: Service
metadata:
  name: g4-kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: g4-kafka-headless
  labels:
    app.kubernetes.io/name: kafka
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
