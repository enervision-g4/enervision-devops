---
# Grafana : l'interface qui trace les métriques collectées par Prometheus.
#
# La source de données est provisionnée par la ConfigMap ci-dessous — rien
# à cliquer après le déploiement. Le mot de passe admin vient du secret
# g4-env (clé GRAFANA_ADMIN_PASSWORD), jamais du manifeste.
#
# Pas d'Ingress : c'est un outil d'administration, on y accède par tunnel.
#   kubectl -n g4-prod port-forward svc/g4-grafana 3000:3000
apiVersion: v1
kind: ConfigMap
metadata:
  name: g4-grafana-datasources
  labels:
    app.kubernetes.io/name: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://g4-prometheus:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: g4-grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: g4-env
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: datasources
          configMap:
            name: g4-grafana-datasources
        - name: data
          persistentVolumeClaim:
            claimName: g4-grafana-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: g4-grafana-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: g4-grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
