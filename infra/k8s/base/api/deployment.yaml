---
# API FastAPI.
#
# Le tag "placeholder" est réécrit à chaque déploiement par
# `kustomize edit set image` (deploy-k8s.yml) avec l'image que le dépôt
# enervision-api vient de pousser sur GHCR.
#
# Les sondes tapent /health, route déjà exposée par app/main.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: g4-api
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: ghcr.io/enervision-g4/enervision-api:placeholder
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: g4-env
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
