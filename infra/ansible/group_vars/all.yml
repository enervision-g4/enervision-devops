---
# ── Paths and versions ────────────────────────────────────────────────
g4_bin_dir: /opt/g4/bin
g4_deploy_user: "{{ lookup('ansible.builtin.env', 'G4_SSH_USER') | default('enervision-g4', true) }}"
g4_stage: prod
g4_env_file: /etc/g4/backup.env

# restic comes from the official release, NOT from the distribution
# package: that one is sometimes built without the cloud backends, and
# then rejects the azure: scheme with "invalid backend" — after a
# provisioning run that looked green.
g4_restic_version: "0.18.1"
g4_restic_bin: /usr/local/bin/restic

# pg_dump has to reach the database. From the host, a container port that
# is not published is unreachable: the backup script uses `docker exec`
# when G4_DB_CONTAINER is set, and these values otherwise.
g4_pghost: "127.0.0.1"
g4_pgport: "5432"

# ── Secrets ───────────────────────────────────────────────────────────
# No vault, no encrypted file in the repository: everything arrives as an
# environment variable, from the GitHub Environment secrets in CI or via
# `export` by hand. A missing value resolves to "", and the play asserts
# before writing anything — failing immediately and clearly rather than
# later and obscurely.
g4_restic_repository: "{{ lookup('ansible.builtin.env', 'RESTIC_REPOSITORY') }}"
g4_restic_password: "{{ lookup('ansible.builtin.env', 'RESTIC_PASSWORD') }}"
g4_azure_account_name: "{{ lookup('ansible.builtin.env', 'AZURE_ACCOUNT_NAME') }}"
g4_azure_account_key: "{{ lookup('ansible.builtin.env', 'AZURE_ACCOUNT_KEY') }}"
g4_postgres_user: "{{ lookup('ansible.builtin.env', 'POSTGRES_USER') }}"
g4_postgres_password: "{{ lookup('ansible.builtin.env', 'POSTGRES_PASSWORD') }}"
g4_postgres_db: "{{ lookup('ansible.builtin.env', 'POSTGRES_DB') }}"
