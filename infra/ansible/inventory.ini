; The machine that runs the database and its backups.
;
; No value in this file is specific to any particular host — the address,
; the user and the key all come from environment variables. Targeting a
; different machine (a cloud VM during a recovery, a test VM) is a matter
; of exporting G4_SSH_HOST elsewhere, not of editing anything here.
;
; G4_SSH_HOST deliberately has NO default. An arbitrary default would
; produce an incomprehensible DNS resolution error instead of saying what
; is missing.

[backup_agents]
g4-host ansible_host="{{ lookup('ansible.builtin.env', 'G4_SSH_HOST') | default(undef(hint='G4_SSH_HOST is empty or unset: export it with an IP address or a hostname reachable over SSH, then run again'), true) }}"

[backup_agents:vars]
ansible_user="{{ lookup('ansible.builtin.env', 'G4_SSH_USER') | default('enervision-g4', true) }}"
ansible_port="{{ lookup('ansible.builtin.env', 'G4_SSH_PORT') | default('22', true) }}"
ansible_ssh_private_key_file="{{ lookup('ansible.builtin.env', 'G4_SSH_KEY') | default(omit, true) }}"
ansible_python_interpreter=/usr/bin/python3
