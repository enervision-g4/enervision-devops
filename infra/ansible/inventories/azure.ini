; Cible alternative : une VM Azure, ou n'importe quel autre hôte Linux.
;
;   ansible-playbook -i inventories/azure.ini playbooks/site.yml
;

[k3s_servers]
g4-azure ansible_host="{{ lookup('ansible.builtin.env', 'G4_AZURE_HOST') | default('', true) }}"

[backup_agents]
g4-azure

[azure:children]
k3s_servers
backup_agents

[azure:vars]
ansible_user="{{ lookup('ansible.builtin.env', 'G4_AZURE_USER') | default('azureuser', true) }}"
ansible_port="{{ lookup('ansible.builtin.env', 'G4_AZURE_PORT') | default('22', true) }}"
ansible_ssh_private_key_file="{{ lookup('ansible.builtin.env', 'G4_AZURE_KEY') | default(omit, true) }}"
ansible_python_interpreter=/usr/bin/python3
