; Cible réelle : le serveur partagé de l'école.
;
; Aucune valeur de ce fichier n'est propre à cette machine — l'adresse,
; l'utilisateur et la clé viennent de variables d'environnement, fournies
; par les secrets de l'Environment GitHub en CI, ou exportées à la main.

[k3s_servers]
g4-onprem ansible_host="{{ lookup('ansible.builtin.env', 'G4_SSH_HOST') | default('host.docker.internal', true) }}"

[backup_agents]
g4-onprem

[onprem:children]
k3s_servers
backup_agents

[onprem:vars]
ansible_user="{{ lookup('ansible.builtin.env', 'G4_SSH_USER') | default('enervision-g4', true) }}"
ansible_port="{{ lookup('ansible.builtin.env', 'G4_SSH_PORT') | default('22', true) }}"
ansible_ssh_private_key_file="{{ lookup('ansible.builtin.env', 'G4_SSH_KEY') | default(omit, true) }}"
ansible_python_interpreter=/usr/bin/python3
