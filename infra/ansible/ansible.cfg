[defaults]
inventory          = inventory.ini
host_key_checking  = False
retry_files_enabled = False
interpreter_python = auto_silent

# Readable output: one YAML block per task instead of a single-line JSON.
#
# Do NOT write `stdout_callback = yaml`: that name resolved to the
# community.general.yaml plugin, REMOVED in community.general 12.0.0. The
# replacement has been built into ansible-core since 2.13 — the `default`
# callback with its formatting option.
#
# The key really is `callback_result_format` (an option of the `default`
# plugin), not `result_format`: the latter is accepted without error and
# silently ignored.
stdout_callback         = default
callback_result_format  = yaml

[ssh_connection]
pipelining = True
