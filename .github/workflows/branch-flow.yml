name: Branch flow check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  call-check:
    uses: ./.github/workflows/enforce-branch-flow.yml
    with:
      protected_base: main
      required_source: develop
      dev_base: develop
      dev_allowed_patterns: 'feature/* fix/* hotfix/*'
