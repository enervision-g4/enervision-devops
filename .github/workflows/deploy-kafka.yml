name: Deploy Kafka

# Le broker n'a pas de depot de service : aucune image n'est construite pour lui,
# il est declenche a la main comme la base de donnees.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Environnement cible"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  # Plancher explicite exige par l'analyse de securite. contents: read pour le
  # checkout ; packages: read parce que deploy.yml ouvre une session GHCR afin de
  # recuperer les images privees des services. Un workflow appelant plafonne les
  # permissions du workflow appele : retirer packages ici casserait ce pull.
  contents: read
  packages: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      service: kafka
      image: unused
      stage: ${{ inputs.stage }}
    secrets: inherit
