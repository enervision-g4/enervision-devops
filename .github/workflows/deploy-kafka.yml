name: Deploy Kafka

# Le broker n'a pas de depot de service : aucune image n'est construite pour lui,
# il est declenche a la main comme la base de donnees.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Environnement cible"
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      service: kafka
      image: unused
      stage: ${{ inputs.stage }}
    secrets: inherit
