name: Deploy MLflow

# Serveur de suivi : aucun depot de service, image officielle publique, declenche
# a la main comme la base de donnees et le broker.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Environnement cible"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  # Plancher explicite exige par l'analyse de securite. contents: read pour le
  # checkout ; packages: read parce que deploy.yml ouvre une session GHCR afin de
  # recuperer les images privees des services. Un workflow appelant plafonne les
  # permissions du workflow appele : retirer packages ici casserait ce pull.
  contents: read
  packages: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      service: mlflow
      image: unused
      stage: ${{ inputs.stage }}
    secrets: inherit
