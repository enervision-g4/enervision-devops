name: CI

# Reusable workflow : build, lint and unit test

on:
  workflow_call:
    inputs:
      language:
        description: "python | node | none"
        required: false
        default: "none"
        type: string
      working-directory:
        description: "Racine du code à analyser"
        required: false
        default: "."
        type: string
      python-version:
        required: false
        default: "3.14"
        type: string
      node-version:
        required: false
        default: "24"
        type: string
      run-tests:
        description: "false pour un dépôt qui n'a pas encore de tests"
        required: false
        default: true
        type: boolean
      dockerfile:
        description: "Chemin du Dockerfile à construire. Vide = pas de build d'image."
        required: false
        default: ""
        type: string
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: test
    if: inputs.language != 'none' && inputs.language != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Python
      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install the Python dependencies
        if: inputs.language == 'python'
        run: |
          python -m pip install --upgrade pip
          # uv (pyproject + uv.lock, cas de enervision-etl) ou
          # requirements.txt (cas de enervision-api) : on prend ce qui est là.
          if [ -f uv.lock ]; then
            pip install uv
            uv sync --all-extras --dev
          elif [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install ruff pytest pytest-cov

      - name: ruff (lint)
        if: inputs.language == 'python'
        run: ruff check --output-format=github .

      - name: ruff (format)
        if: inputs.language == 'python'
        run: ruff format --check .

      - name: pytest
        if: inputs.language == 'python' && inputs.run-tests
        run: |
          pytest \
            --junitxml=junit-report.xml \
            --cov --cov-report=xml --cov-report=term

      # Node
      - name: Set up Node
        if: inputs.language == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install the Node dependencies
        if: inputs.language == 'node'
        run: npm ci

      - name: eslint
        if: inputs.language == 'node'
        run: npm run lint --if-present

      - name: prettier
        if: inputs.language == 'node'
        run: npx --no-install prettier --check . || echo "::warning::prettier absent ou non configuré"

      - name: Tests
        if: inputs.language == 'node' && inputs.run-tests
        run: npm test --if-present

      - name: Build
        if: inputs.language == 'node'
        run: npm run build --if-present

      # Image
      - name: Build the Docker image
        if: inputs.dockerfile != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ inputs.dockerfile }}
          push: false
          tags: enervision-ci:${{ github.sha }}

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ inputs.language }}
          path: |
            ${{ inputs.working-directory }}/junit-report.xml
            ${{ inputs.working-directory }}/coverage.xml
          if-no-files-found: ignore
          retention-days: 14
