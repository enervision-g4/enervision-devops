name: Security scan

on:
  workflow_call:
    inputs:
      image-ref:
        description: "Image à scanner. Vide = pas de scan d'image."
        required: false
        default: ""
        type: string
      scan-terraform:
        required: false
        default: true
        type: boolean
      scan-ansible:
        required: false
        default: true
        type: boolean
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Dépendances et fichiers
      - name: Trivy (système de fichiers)
        id: trivy-fs
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Image
      - name: Trivy (image)
        if: always() && inputs.image-ref != ''
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image-ref }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      - name: checkov (Terraform)
        id: checkov
        if: inputs.scan-terraform && hashFiles('infra/terraform/**/*.tf') != ''
        continue-on-error: true
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true

      # Rapports - Security tab
      - name: Upload Trivy fs SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload Trivy image SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Upload checkov SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
          category: checkov

      # Résumé lisible directement dans l'onglet Checks de la PR
      - name: Job summary
        if: always()
        run: |
          echo "## 🔒 Résultats du scan de sécurité" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scan | Statut |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trivy (fs) | ${{ steps.trivy-fs.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| checkov (Terraform) | ${{ steps.checkov.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Détails complets dans l'onglet **Security**." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            trivy-fs.sarif
            trivy-image.sarif
            checkov.sarif
          if-no-files-found: ignore
          retention-days: 30
