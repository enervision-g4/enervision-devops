name: Enforce branch flow

on:
  workflow_call:
    inputs:
      protected_base:
        type: string
        default: 'main'
      required_source:
        type: string
        default: 'develop'
      dev_base:
        type: string
        default: 'develop'
      dev_allowed_patterns:
        type: string
        default: 'feature/* fix/* chore/*'

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR source/target
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PROTECTED_BASE: ${{ inputs.protected_base }}
          REQUIRED_SOURCE: ${{ inputs.required_source }}
          DEV_BASE: ${{ inputs.dev_base }}
          DEV_ALLOWED_PATTERNS: ${{ inputs.dev_allowed_patterns }}
        run: |
          BASE="$BASE_REF"
          HEAD="$HEAD_REF"

          echo "PR: $HEAD -> $BASE"

          # Rule 1: main only accepts PRs from develop
          if [ "$BASE" = "$PROTECTED_BASE" ] && [ "$HEAD" != "$REQUIRED_SOURCE" ]; then
            echo "❌ PRs into '$PROTECTED_BASE' are only allowed from '$REQUIRED_SOURCE'."
            exit 1
          fi

          # Rule 2: develop only accepts PRs from allowed branch patterns
          if [ "$BASE" = "$DEV_BASE" ]; then
            MATCHED=false
            for pattern in $DEV_ALLOWED_PATTERNS; do
              case "$HEAD" in
                $pattern) MATCHED=true ;;
              esac
            done

            if [ "$MATCHED" = false ]; then
              echo "❌ PRs into '$DEV_BASE' must come from one of: $DEV_ALLOWED_PATTERNS"
              exit 1
            fi
          fi

          echo "✅ Branch flow OK"
