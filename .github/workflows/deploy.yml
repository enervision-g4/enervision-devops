name: Deploy service

# Workflow réutilisable, appelé depuis les dépôts de service
# (enervision-api, enervision-etl, enervision-ml, ...) via :
#
#   jobs:
#     deploy:
#       uses: <org>/enervision-devops/.github/workflows/deploy.yml@main
#       with:
#         service: api
#         stage: prod        # ou "dev"
#         image: ghcr.io/<org>/enervision-api:${{ github.sha }}
#       secrets: inherit
#
# Le serveur on-premise n'est joignable que depuis le réseau de l'école :
# un runner GitHub hébergé (ubuntu-latest) ne peut pas s'y connecter en SSH.
# On s'appuie donc sur les runners self-hosted déjà en place
# (infra/runners/), qui tournent avec le socket Docker de l'hôte monté :
# le job s'exécute directement "sur" le serveur, pas de SSH nécessaire.
#
# "stage" choisit le runner (label dev/prod, cf infra/runners/
# docker-compose.runners.yml) ET l'environnement GitHub associé
# (onprem-dev / onprem-prod), qui porte le secret ENV_FILE_CONTENTS.

on:
  workflow_call:
    inputs:
      service:
        description: "Nom du service (correspond à compose/<service>.yml)"
        required: true
        type: string
      stage:
        description: "dev ou prod — choisit le runner, l'environnement onprem-<stage>, et suffixe les ressources Docker"
        required: true
        type: string
      image:
        description: "Image Docker complète (avec tag) à déployer"
        required: true
        type: string
    secrets:
      ENV_FILE_CONTENTS:
        description: "Contenu du .env de l'environnement cible (secret GitHub par environnement onprem-<stage>)"
        required: true

jobs:
  deploy:
    runs-on: [self-hosted, "${{ inputs.stage }}"]
    environment: "onprem-${{ inputs.stage }}"
    steps:
      - name: Checkout enervision-devops
        uses: actions/checkout@v7

      - name: Write .env and deploy
        env:
          ENV_FILE_CONTENTS: ${{ secrets.ENV_FILE_CONTENTS }}
          IMAGE: ${{ inputs.image }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          TARGET_DIR="/opt/g4/${{ inputs.service }}-${{ inputs.stage }}"
          sudo mkdir -p "$TARGET_DIR"
          sudo cp "compose/${{ inputs.service }}.yml" "$TARGET_DIR/"
          sudo cp -r db/init "$TARGET_DIR/db-init" 2>/dev/null || true

          printf '%s\n' "$ENV_FILE_CONTENTS" | sudo tee "$TARGET_DIR/.env" > /dev/null
          {
            echo "IMAGE=$IMAGE"
            echo "STAGE=$STAGE"
          } | sudo tee -a "$TARGET_DIR/.env" > /dev/null

          docker network create g4_net 2>/dev/null || true
          cd "$TARGET_DIR"
          docker compose -f "${{ inputs.service }}.yml" pull
          docker compose -f "${{ inputs.service }}.yml" up -d
          docker image prune -f

# NOTE (service "db" uniquement) : compose/db.yml monte "./db/init" en bind
# mount. Comme le runner self-hosted tourne lui-même dans un conteneur avec
# le socket Docker de l'hôte monté (Docker-outside-of-Docker), un chemin
# relatif checké out DANS le runner n'est pas forcément résolu par le
# démon Docker de l'HÔTE de la même façon. Si le déploiement de "db"
# échoue sur le bind mount, il faudra soit committer db/init sur un
# chemin absolu connu de l'hôte, soit passer par une image Postgres custom
# qui embarque déjà les scripts d'init. Pas bloquant pour api/dashboard
# (aucun bind mount).