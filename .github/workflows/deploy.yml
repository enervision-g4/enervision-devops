name: Deploy service

# Workflow réutilisable, appelé depuis les dépôts de service
# (enervision-api, enervision-etl, enervision-ml, ...) via :
#
#   jobs:
#     deploy:
#       uses: <org>/enervision-devops/.github/workflows/deploy.yml@main
#       with:
#         service: api
#         environment: onprem
#         image: ghcr.io/<org>/enervision-api:${{ github.sha }}
#       secrets: inherit
#
# Ce fichier ne connaît rien de spécifique à un service : il se contente
# de lancer `docker compose -f compose/<service>.yml up -d` avec le
# `.env` de l'environnement demandé, sur la machine cible.

on:
  workflow_call:
    inputs:
      service:
        description: "Nom du service (correspond à compose/<service>.yml)"
        required: true
        type: string
      environment:
        description: "Environnement cible (onprem, azure, ovh...)"
        required: true
        type: string
      image:
        description: "Image Docker complète (avec tag) à déployer"
        required: true
        type: string
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSH_PORT:
        required: true
      ENV_FILE_CONTENTS:
        description: "Contenu du .env de l'environnement cible (secret GitHub par environnement)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout enervision-devops
        uses: actions/checkout@v7

      - name: Copy compose file + init scripts to target
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "compose/${{ inputs.service }}.yml,db/init/*"
          target: "/opt/g4/${{ inputs.service }}"

      - name: Write .env and deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE
          script: |
            mkdir -p /opt/g4/${{ inputs.service }}
            cat > /opt/g4/${{ inputs.service }}/.env << 'EOF'
            ${{ secrets.ENV_FILE_CONTENTS }}
            IMAGE=${{ inputs.image }}
            EOF
            docker network create g4_net 2>/dev/null || true
            cd /opt/g4/${{ inputs.service }}
            docker compose -f compose/${{ inputs.service }}.yml pull
            docker compose -f compose/${{ inputs.service }}.yml up -d
            docker image prune -f
