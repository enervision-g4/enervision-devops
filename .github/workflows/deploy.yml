name: Deploy service

# Workflow réutilisable appelé par les dépôts de service (enervision-api, enervision-etl, ...).
#
#   jobs:
#     deploy:
#       uses: enervision-g4/enervision-devops/.github/workflows/deploy.yml@main
#       with:
#         service: api
#         environment: onprem
#         image: ghcr.io/enervision-g4/enervision-api:${{ github.sha }}
#       secrets: inherit
#

on:
  workflow_call:
    inputs:
      service:
        description: "Nom du service (correspond à infra/k8s/base/<service>/)"
        required: true
        type: string
      environment:
        description: "Préfixe d'Environment GitHub (onprem, ...)"
        required: true
        type: string
      image:
        description: "Image Docker complète (avec tag) à déployer"
        required: true
        type: string
      stage:
        description: "dev ou prod. Vide = déduit de la branche appelante."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-k8s.yml
    with:
      stage: >-
        ${{ inputs.stage != ''
            && inputs.stage
            || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
                && 'prod' || 'dev') }}
      environment_prefix: ${{ inputs.environment }}
      service: ${{ inputs.service }}
      image: ${{ inputs.image }}
    secrets: inherit

# NOTE (service "db" uniquement) : compose/db.yml monte "./db/init" en bind
# mount. Comme le runner self-hosted tourne lui-même dans un conteneur avec
# le socket Docker de l'hôte monté (Docker-outside-of-Docker), un chemin
# relatif checké out DANS le runner n'est pas forcément résolu par le
# démon Docker de l'HÔTE de la même façon. Si le déploiement de "db"
# échoue sur le bind mount, il faudra soit committer db/init sur un
# chemin absolu connu de l'hôte, soit passer par une image Postgres custom
# qui embarque déjà les scripts d'init. Pas bloquant pour api/dashboard
# (aucun bind mount).